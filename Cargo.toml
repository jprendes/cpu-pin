[package]
name = "cpu-pin"
version = "0.1.3"
edition = "2021"
description = "Cross-platform CPU core type detection (P/E cores) and thread pinning"
license = "MIT"

[features]
tokio = ["dep:tokio"]

[dependencies]
once_cell = "1"
tokio = { version = "1", features = ["process"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "process"] }
